name: Build CREATUBE STUDIO

on:
  # Otomatis berjalan setiap kali ada push ke branch main
  push:
    branches: [ main ]
  # Bisa juga dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — BUILD macOS (Intel + Apple Silicon)
  # ═══════════════════════════════════════════════════════════
  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-13, macos-14 ]     # 13 = Intel x86_64, 14 = Apple Silicon arm64

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependency
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow pyinstaller

      - name: 🧹 Bersihkan build lama
        run: rm -rf build dist

      - name: 🚀 Build .app
        run: python3 -m PyInstaller CREATUBE_STUDIO.spec --noconfirm --clean

      - name: ✅ Verifikasi .app
        run: |
          ls -la "dist/CREATUBE STUDIO.app/Contents/MacOS/"
          test -x "dist/CREATUBE STUDIO.app/Contents/MacOS/CREATUBE STUDIO"

      - name: 🗜 Package jadi zip (hilangkan atribut yang bikin error)
        run: |
          cd dist
          # -y: simpan symlink, --no-qtn: Hindari quarantine attribute
          zip -r -y --no-qtn "../CREATUBE-STUDIO-macOS-${{ matrix.os }}.zip" "CREATUBE STUDIO.app"

      - name: ⬆ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CREATUBE-STUDIO-macOS-${{ matrix.os }}
          path: CREATUBE-STUDIO-macOS-${{ matrix.os }}.zip
          retention-days: 90

      # ── (Opsional) Auto sign & notarize — hanya kalau secret sudah diset ──
      # Aktifkan dengan menambah secrets berikut di repo Settings → Secrets:
      #   APPLE_ID         : Apple ID developer Anda
      #   APPLE_PASSWORD   : app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID    : Team ID developer Anda
      #   APPLE_CERTIFICATE: base64 dari Developer ID Application.p12
      #   APPLE_CERT_PASSWORD: password file .p12
      - name: 🔏 Sign & Notarize (opsional)
        if: ${{ secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          APP="dist/CREATUBE STUDIO.app"
          codesign --deep --options runtime --keychain build.keychain \
            --sign "Developer ID Application: $APPLE_TEAM_ID" "$APP"
          ditto -c -k --keepParent "$APP" "notarize.zip"
          xcrun notarytool submit "notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          echo "✅ Signed & Notarized"

  # ═════════════В═════════════════════════════════════════════
  # JOB 2 — BUILD WINDOWS
  # ═══════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller

      - name: 🧹 Bersihkan build lama
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: 🚀 Build .exe
        run: python -m PyInstaller CREATUBE_STUDIO.spec --noconfirm --clean

      - name: ✅ Verifikasi .exe
        run: |
          Get-ChildItem "dist/CREATUBE STUDIO/" | Select-Object Name
          Test-Path "dist/CREATUBE STUDIO/CREATUBE STUDIO.exe" -PathType Leaf

      - name: 🗜 Package jadi zip
        run: |
          Compress-Archive -Path "dist/CREATUBE STUDIO" -DestinationPath "CREATUBE-STUDIO-Windows.zip"

      - name: ⬆ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CREATUBE-STUDIO-Windows
          path: CREATUBE-STUDIO-Windows.zip
          retention-days: 90
